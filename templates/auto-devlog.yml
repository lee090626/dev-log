name: auto-devlog

# ────────────────────────────────────────────────────────────────
# 이 파일은 템플릿입니다. 아래 경로로 옮기면 파이프라인이 켜집니다.
#     .github/workflows/auto-devlog.yml
# GitHub 웹: Add file → Create new file → 파일 이름에 위 경로를 입력 → 이 내용 붙여넣기 → Commit
# (이 저장소를 만든 도구의 토큰에 Actions 파일 쓰기 권한이 없어 이 한 파일만 직접 옮겨야 합니다)
# ────────────────────────────────────────────────────────────────
# 실행 경로 4가지
#   1) 15분마다 정기 스캔 (schedule) — 내 모든 레포의 최근 머지 PR을 훑어 새것만 기록·전파
#      머지 후 15분 이내에 자동 감지됩니다. 23:00 KST 시각도 15분 배수라 함께 돌아
#      하루치 최종 정산 역할도 그대로 합니다.
#   2) 이 저장소(dev-log)의 PR이 머지됐을 때
#   3) 다른 프로젝트 레포가 repository_dispatch(devlog)로 호출했을 때
#      (templates/target-repo-workflow.yml 을 그 레포에 붙이면 자동)
#   4) Actions 탭에서 수동 실행 — mode: scan(기본) 또는 single
#
# 스캔은 토큰이 읽을 수 있는 레포만 봅니다. 조직 레포·비공개 레포까지 훑으려면
# Settings → Secrets and variables → Actions 의 DEVLOG_GITHUB_TOKEN 에
# repo 읽기 권한이 있는 PAT를 넣어 두세요. (없으면 github.token 으로 이 저장소만 보임)

on:
  schedule:
    - cron: '0 * * * *'          # 1시간마다 자동 감지 및 전파 (매시간 정각)
  pull_request:
    types: [closed]
  repository_dispatch:
    types: [devlog]
  workflow_dispatch:
    inputs:
      mode:
        description: 'scan = 내 모든 레포 최근 PR 스캔 / single = PR 하나만 기록'
        type: choice
        options: [scan, single]
        default: scan
      days:
        description: 'scan 모드: 최근 며칠을 볼지 (기본 14)'
        required: false
        default: '14'
      source_repo:
        description: 'single 모드: 분석할 레포지토리 (owner/name). 비우면 이 저장소'
        required: false
        default: ''
      pr_number:
        description: 'single 모드: PR 번호'
        required: false
        default: ''
      publish:
        description: '전파 채널: all | notion | x | none'
        required: false
        default: 'all'

concurrency:
  group: devlog
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────────
  # 정기·수동 스캔: 아직 기록되지 않은 머지 PR을 찾아 기록 → 노션 → X
  # ────────────────────────────────────────────────────────────────
  scan:
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'single')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout dev-log
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 스캔 → 기록 생성 → (publish) 노션·X. 여러 건을 한 번에 처리한다.
      - name: Scan merged PRs
        env:
          DEVLOG_USER: ${{ vars.DEVLOG_USER || github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.DEVLOG_GITHUB_TOKEN || github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          INPUT_DAYS: ${{ github.event.inputs.days }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish }}
        run: |
          set -eu
          DAYS="${INPUT_DAYS:-14}"
          PUBLISH="${INPUT_PUBLISH:-all}"
          echo "스캔: 최근 ${DAYS}일 · 전파 ${PUBLISH}"
          python3 scripts/devlog.py scan --days "$DAYS" --publish "$PUBLISH"

      - name: Commit and push
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          if [ -z "$(git status --porcelain -- logs)" ]; then
            echo "::notice::새 기록이 없습니다."
            exit 0
          fi
          git config user.name  "dev-log"
          git config user.email "dev-log@users.noreply.github.com"
          git add logs
          git commit -m "log: 자동 스캔 $(date -u +%Y-%m-%d)"
          git push origin "HEAD:${DEFAULT_BRANCH}" || {
            git pull --rebase --autostash origin "${DEFAULT_BRANCH}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          }

  # ────────────────────────────────────────────────────────────────
  # PR 하나만 기록 (머지 이벤트·dispatch·수동 single)
  # ────────────────────────────────────────────────────────────────
  record:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'single')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout dev-log
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ------------------------------------------------------------ 대상 PR 결정
      - name: Resolve target PR
        id: target
        env:
          EVENT: ${{ github.event_name }}
          EVENT_REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          DISPATCH_REPO: ${{ github.event.client_payload.source_repo }}
          DISPATCH_PR: ${{ github.event.client_payload.pr_number }}
          INPUT_REPO: ${{ github.event.inputs.source_repo }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
        run: |
          set -eu
          case "$EVENT" in
            pull_request)        REPO="${EVENT_REPO}"; PR="${EVENT_PR}" ;;
            repository_dispatch) REPO="${DISPATCH_REPO:-$EVENT_REPO}"; PR="${DISPATCH_PR:-}" ;;
            workflow_dispatch)   REPO="${INPUT_REPO:-$EVENT_REPO}"; PR="${INPUT_PR:-}" ;;
            *) echo "지원하지 않는 이벤트: $EVENT"; exit 1 ;;
          esac
          if [ -z "$PR" ]; then
            echo "::error::PR 번호가 없습니다. source_repo 와 pr_number 를 함께 넣어 주세요."
            exit 1
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "대상: $REPO#$PR"

      # ------------------------------------------------------------ 기록 생성
      - name: Generate entry
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.DEVLOG_GITHUB_TOKEN || github.token }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          set -eu
          python3 scripts/devlog.py entry \
            --repo "${{ steps.target.outputs.repo }}" \
            --pr "${{ steps.target.outputs.pr }}"
          NEW_FILES=$(git status --porcelain -- logs | awk '{print $2}' | grep -E '^logs/[0-9]{4}/.*\.md$' || true)
          if [ -z "$NEW_FILES" ]; then
            echo "entry_file=" >> "$GITHUB_OUTPUT"
            echo "::notice::새 기록이 없습니다(이미 기록되었거나 생성 실패)."
          else
            FIRST=$(echo "$NEW_FILES" | head -n 1)
            echo "entry_file=$FIRST" >> "$GITHUB_OUTPUT"
            echo "::notice::기록 생성: $FIRST"
          fi

      # ------------------------------------------------------------ 커밋 & 푸시
      - name: Commit and push
        if: steps.gen.outputs.entry_file != ''
        env:
          ENTRY_FILE: ${{ steps.gen.outputs.entry_file }}
          REPO: ${{ steps.target.outputs.repo }}
          PR: ${{ steps.target.outputs.pr }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          git config user.name  "dev-log"
          git config user.email "dev-log@users.noreply.github.com"
          git add logs
          git commit -m "log(${REPO}): #${PR} $(basename "$ENTRY_FILE" .md)" \
                     -m "자동 생성: https://github.com/${REPO}/pull/${PR}"
          git push origin "HEAD:${DEFAULT_BRANCH}" || {
            git pull --rebase --autostash origin "${DEFAULT_BRANCH}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          }

      # ------------------------------------------------------------ 노션
      - name: Publish to Notion
        # publish 입력이 none/x 면 건너뜀 (PR·dispatch 실행에는 입력이 없어 항상 실행)
        if: steps.gen.outputs.entry_file != '' && github.event.inputs.publish != 'none' && github.event.inputs.publish != 'x'
        continue-on-error: true
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
        run: python3 scripts/devlog.py notion --file "${{ steps.gen.outputs.entry_file }}"

      # ------------------------------------------------------------ X
      - name: Publish to X
        if: steps.gen.outputs.entry_file != '' && github.event.inputs.publish != 'none' && github.event.inputs.publish != 'notion'
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python3 scripts/devlog.py tweet --file "${{ steps.gen.outputs.entry_file }}"

      # ------------------------------------------------------------ 요약
      - name: Summary
        if: always()
        run: |
          {
            echo "### dev-log"
            echo ""
            echo "- 대상: \`${{ steps.target.outputs.repo }}#${{ steps.target.outputs.pr }}\`"
            echo "- 기록: \`${{ steps.gen.outputs.entry_file || '없음' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
